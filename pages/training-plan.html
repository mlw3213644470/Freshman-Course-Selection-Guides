<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培养方案 · 新生选课指南</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="./training-plan.css">
  <link rel="stylesheet" href="../theme-illustration.css">
  <script src="../illustration.js" defer></script>
  <script src="./training-plan.js?v=deepseek-1" defer></script>
</head>
<body class="plan-page">
  <main class="container section plan-layout">
    <header class="plan-header">
      <h1>培养方案</h1>
      <p class="reading-width">选择培养方案 PDF 或 DOCX，分析培养目标、毕业要求、课程分类、学分要求和注意事项。点击“开始分析”后，文件将经本项目后端发送至 DeepSeek 官方 API；未找到的信息标为“原文未说明”。</p>
      <!-- 后续可在此添加页面介绍、使用说明等内容。 -->
    </header>

    <section class="card plan-upload" aria-labelledby="upload-title">
      <h2 id="upload-title">选择培养方案文件</h2>
      <p id="file-help">每次选择一个 PDF 或 DOCX，最大 20 MiB；PDF 最多 200 页。不支持加密或损坏的文件。仅识别文字，不分析文档插图。</p>
      <div class="plan-dropzone" id="dropzone">
        <label class="plan-picker" for="plan-file">
          <span class="plan-picker-title">将文件拖到这里，或点击选择</span>
          <span class="text-small">也可使用 Tab 聚焦，再按 Enter 或空格选择文件</span>
          <input class="plan-file-input" id="plan-file" type="file"
                 accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                 aria-describedby="file-help file-status">
        </label>
      </div>
      <p class="plan-status" id="file-status" role="status" aria-live="polite" aria-atomic="true">正在加载文件选择功能；若此提示一直不变，请刷新页面并检查 JavaScript 是否已启用。</p>
      <div class="plan-selected" id="selected-file" hidden>
        <p class="plan-filename">已选文件：<span id="file-name"></span></p>
        <button class="button button--secondary" id="remove-file" type="button">移除文件</button>
      </div>
      <div class="plan-actions">
        <button class="button" id="analyze-button" type="button">开始分析</button>
      </div>
      <noscript><p>请启用 JavaScript，以显示所选文件名、移除文件和使用拖拽选择功能。</p></noscript>
    </section>

    <section class="card plan-results" aria-labelledby="results-title">
      <h2 id="results-title">分析结果</h2>
      <p class="text-small">结果仅供对照原文，请核查具体课程与学分要求。</p>
      <div class="plan-results-content" id="analysis-results" aria-busy="false"></div>
    </section>
  </main>
  <!-- 独立于主脚本：脚本丢失、缓存或初始化失败时也必须显示错误。 -->
  <script>
    window.addEventListener("load", function () {
      if (!window.trainingPlanReady) {
        var status = document.getElementById("file-status");
        status.textContent = "文件选择脚本加载或初始化失败，请按 Ctrl+F5 刷新，并通过 Vite 首页或 http://127.0.0.1:8002 打开页面。";
        status.dataset.state = "error";
        document.getElementById("analyze-button").addEventListener("click", function () {
          status.textContent = "分析功能尚未初始化，请刷新页面或检查浏览器控制台中的脚本加载错误。";
        });
      }
    });
  </script>
</body>
</html>
